name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# radio-cat-rs comes from Cargo.toml: every crate pinned once, by rev, in
# [workspace.dependencies] (by tag once radio-cat-rs tags a release with
# cat-morse). Every job builds the whole workspace: the CLI and the
# session library, cw-trainer-core.

jobs:
  test:
    name: Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system dependencies
        # `--all-features` / `audio-device` builds cpal, which needs ALSA.
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests (both crates, golden fixtures, structure guards)
        # No sound card is opened by any test: they use doubles.
        run: cargo test --workspace --all-targets

      - name: Tests with audio-device
        run: cargo test --workspace --all-targets --features audio-device

      - name: Doctests (not in --all-targets)
        run: cargo test --workspace --doc

      - name: cw-trainer-core dependency graph
        # The library's whole normal-dependency graph, on every target, is
        # exactly this: cat-morse, serde and thiserror, and what those need.
        run: |
          actual=$(cargo tree -p cw-trainer-core -e normal --target all \
            --prefix none --format '{p}' | sed 's/ v[0-9].*//' | sort -u)
          expected=$(printf '%s\n' cat-morse cw-trainer-core proc-macro2 quote \
            serde serde_core serde_derive syn thiserror thiserror-impl \
            unicode-ident | sort -u)
          if [ "$actual" != "$expected" ]; then
            echo "cw-trainer-core's dependency graph changed:"
            diff <(echo "$expected") <(echo "$actual")
            exit 1
          fi

  windows:
    name: Windows (MSVC)
    runs-on: windows-latest

    # Authoritative Windows verification (radio-cat-rs ADR 0012):
    # x86_64-pc-windows-msvc is the host target here, so no --target flag.
    # The golden record and transcript fixtures must match exactly here too.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-windows-msvc-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-windows-msvc-

      - name: cargo check
        run: cargo check --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace --all-targets

      - name: cargo check with audio-device (WASAPI speaker)
        run: cargo check --workspace --all-targets --features audio-device

      - name: cargo test with audio-device
        run: cargo test --workspace --all-targets --features audio-device

  mobile:
    name: cw-trainer-core (${{ matrix.target }})
    runs-on: ubuntu-latest

    # The library is checked (not linked) for each target: no SDK or NDK
    # is needed, because nothing in its graph has a C build or a platform
    # API. A failure here is a portability bug to fix in this repository or
    # upstream in cat-morse.
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-apple-ios
          - aarch64-apple-ios-sim
          - aarch64-apple-darwin
          - aarch64-linux-android
          - x86_64-linux-android
          - armv7-linux-androideabi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.93"

      - name: Add the target
        run: rustup target add ${{ matrix.target }}

      - name: Cache cargo registry and build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ matrix.target }}-

      - name: cargo check
        run: cargo check -p cw-trainer-core --lib --target ${{ matrix.target }}
