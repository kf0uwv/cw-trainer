[workspace]
resolver = "2"
# The CLI (this package) and the session library it is built on. Both are
# built, tested and linted by default: the library exactly as an app
# consumer builds it, with nothing of the CLI's enabled.
members = ["cw-trainer-core"]
default-members = [".", "cw-trainer-core"]

[workspace.package]
edition = "2021"
authors = ["Matt Franklin <radiombf@gmail.com>"]
license = "Apache-2.0"
homepage = "https://github.com/kf0uwv/cw-trainer"
repository = "https://github.com/kf0uwv/cw-trainer"
rust-version = "1.75"

# Every radio-cat-rs crate this repository uses, pinned once, all to the
# same revision so exactly one copy of each is linked. Pinned by rev until
# radio-cat-rs tags a release that carries cat-morse, then by tag. See
# CLAUDE.md.
[workspace.dependencies]
cat-morse = { git = "https://github.com/kf0uwv/radio-cat-rs", rev = "b821bf47ceb57b8f23e437ca3136cd745235e180" }
cat-native = { git = "https://github.com/kf0uwv/radio-cat-rs", rev = "b821bf47ceb57b8f23e437ca3136cd745235e180" }
cat-signal = { git = "https://github.com/kf0uwv/radio-cat-rs", rev = "b821bf47ceb57b8f23e437ca3136cd745235e180" }
cat-signal-audio = { git = "https://github.com/kf0uwv/radio-cat-rs", rev = "b821bf47ceb57b8f23e437ca3136cd745235e180" }
serde = { version = "1.0.203", features = ["derive"] }
thiserror = "1.0.61"

[package]
name = "cw-trainer"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Radio-neutral Morse code (CW) trainer for any radio-cat-rs radio"
rust-version.workspace = true

[lib]
name = "cw_trainer"
path = "src/lib.rs"

[[bin]]
name = "cw-trainer"
path = "src/main.rs"

[dependencies]
# The session library: options, contacts, scoring, adaptive speed and
# records, with no I/O. This package is its terminal, speaker and files.
cw-trainer-core = { path = "cw-trainer-core", version = "0.1.0" }
# The shared, radio-independent CAT library: https://github.com/kf0uwv/radio-cat-rs.
# This program is a cat-native *client* of a radio's server and depends on
# nothing radio-specific -- never a radio crate (ts570d's `radio`, ft991a,
# ic7100), never cat-framework or any cat-transport-* crate. See CLAUDE.md.
cat-native = { workspace = true }
cat-signal = { workspace = true }
cat-signal-audio = { workspace = true }
# Radio-independent Morse code (radio-cat-rs ADR 0021): scripts, keying,
# band synthesis and copy scoring. `serde` so per-character stats and
# session history can be persisted.
cat-morse = { workspace = true, features = ["serde"] }

# audio.json, stats and session history.
serde = { workspace = true }
serde_json = "1.0.117"
thiserror = { workspace = true }
# One info line naming the opened audio device, as ts570d logs it.
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }

# The copy-practice input line: raw-mode key reading only, no TUI.
crossterm = "0.27.0"
# Leave raw mode on Ctrl-C *and* on termination signals (SIGTERM/SIGHUP,
# Windows console close/shutdown), not only on panic -- see src/term.rs.
ctrlc = { version = "3.0", features = ["termination"] }

[dev-dependencies]
tempfile = "3.10.1"

[features]
default = []
# Play through a local sound card. Off by default: it wants the platform's
# sound headers (ALSA on Linux). Without it the trainer cannot play a note
# and says so rather than guessing.
audio-device = ["cat-signal-audio/device"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
